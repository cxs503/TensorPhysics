# ice_anchor → SIR 七腿输出量映射表（机器可读 YAML）
# 版本: 1.0.0 (m598)
# 生成时间: 2026-01-01
#
# SIR 七腿定义:
#   SIR-1: 流场/水动力（Flow/Hydrodynamics）
#   SIR-2: 流场摄入（Flow Ingest）
#   SIR-3: 浮力/自由面（Buoyancy/Free Surface）
#   SIR-4: 冰-船相互作用（Ice-Ship Interaction）
#   SIR-5: 断裂传播（Fracture Propagation）
#   SIR-6: 冰载荷统计（Ice Load Statistics）
#   SIR-7: 总体性能评估（Overall Performance）

mapping_version: "1.0.0"
mission_id: 598
generated_at: "2026-01-01T00:00:00Z"

sir_legs:
  SIR-1:
    name: "流场/水动力"
    description: "LBM 流场求解、水动力载荷"
    output_quantities:
      - "velocity_field"
      - "pressure_field"
      - "hydrodynamic_resistance"
  SIR-2:
    name: "流场摄入"
    description: "LBM 流场快照提取与传递"
    output_quantities:
      - "lbm_snapshot"
      - "nodal_forces"
      - "ledger_a"
  SIR-3:
    name: "浮力/自由面"
    description: "浮力计算、自由面追踪"
    output_quantities:
      - "buoyancy_force"
      - "free_surface_elevation"
      - "draft_change"
  SIR-4:
    name: "冰-船相互作用"
    description: "冰载荷、冰-船接触力"
    output_quantities:
      - "ice_resistance_total"
      - "ice_pressure_distribution"
      - "contact_force_history"
  SIR-5:
    name: "断裂传播"
    description: "渐进裂纹扩展、键断裂演化"
    output_quantities:
      - "crack_propagation_path"
      - "bond_breakage_history"
      - "fracture_dissipation"
  SIR-6:
    name: "冰载荷统计"
    description: "冰载荷极值、概率分布"
    output_quantities:
      - "peak_ice_load"
      - "load_probability_distribution"
      - "return_period_load"
  SIR-7:
    name: "总体性能评估"
    description: "航速-冰厚曲线、功率需求"
    output_quantities:
      - "speed_ice_curve"
      - "required_power"
      - "performance_index"

# 锚点 → SIR 腿映射
anchor_to_sir:
  A1:
    anchor_id: "A1"
    name: "Lindqvist (1989) 平整冰总阻力"
    category: "resistance"
    sir_legs:
      - leg: "SIR-1"
        output: "hydrodynamic_resistance"
        calibration_type: "benchmark"
        notes: "Lindqvist 总阻力 vs LBM 水动力阻力对标"
      - leg: "SIR-4"
        output: "ice_resistance_total"
        calibration_type: "primary"
        notes: "直接对标冰阻力总值"
      - leg: "SIR-7"
        output: "speed_ice_curve"
        calibration_type: "validation"
        notes: "航速-冰厚曲线验证"
  A2:
    anchor_id: "A2"
    name: "Keinonen (1983) 破冰阻力半经验式"
    category: "resistance"
    sir_legs:
      - leg: "SIR-1"
        output: "hydrodynamic_resistance"
        calibration_type: "benchmark"
        notes: "Keinonen 阻力 vs LBM 水动力阻力对标"
      - leg: "SIR-4"
        output: "ice_resistance_total"
        calibration_type: "secondary"
        notes: "辅助对标冰阻力"
  A3:
    anchor_id: "A3"
    name: "Huang et al. (2014) 冰阻力修正公式"
    category: "resistance"
