[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorphysics"
version = "0.1.0"
description = "Backend-neutral HPC and AI scientific workflow orchestration for multiphysics engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
s3 = ["boto3>=1.34"]
torch = ["torch>=2.1"]
ice = ["numpy>=1.26"]
plot = ["matplotlib>=3.7", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
